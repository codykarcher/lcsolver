<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbojet &mdash; component test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #14161a; color: #d7dbe0;
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; }

  #panel { position: fixed; top: 14px; left: 14px; width: 228px; padding: 14px 16px;
    background: #1c1f25e6; border: 1px solid #2e343d; border-radius: 10px;
    backdrop-filter: blur(6px); }
  #panel h1 { margin: 0 0 2px; font-size: 13px; }
  #panel .sub { margin: 0 0 12px; font-size: 11px; color: #838d9a; }
  #panel h2 { margin: 12px 0 6px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .07em; color: #6f7884;
    border-top: 1px solid #2e343d; padding-top: 10px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; }
  .row label { font-size: 11.5px; color: #aab3bf; }
  .row output { font-variant-numeric: tabular-nums; font-size: 11.5px; color: #e6a34a; }
  input[type=range] { width: 100%; margin: 1px 0 8px; accent-color: #e6a34a; }
  .check { display: flex; align-items: center; gap: 7px; margin: 3px 0 7px;
    font-size: 11.5px; color: #aab3bf; }
  button { width: 100%; padding: 6px 10px; margin-top: 4px; font: inherit;
    font-size: 11.5px; color: #d7dbe0; background: #262b33;
    border: 1px solid #363d47; border-radius: 6px; cursor: pointer; }
  button:hover { background: #2f353f; }
  #readout { margin-top: 10px; padding-top: 9px; border-top: 1px solid #2e343d;
    font-size: 10.5px; color: #6f7884; font-variant-numeric: tabular-nums; }
  #readout span { color: #98a2ae; }
  .hint { margin-top: 8px; font-size: 10.5px; color: #565e69; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="panel">
  <h1>Turbojet</h1>
  <p class="sub">core only &mdash; no nacelle</p>

  <div class="row"><label for="rCase">case radius</label><output id="oR"></output></div>
  <input type="range" id="rCase" min="0.10" max="1.20" step="0.01" value="0.42">

  <div class="row"><label for="lod">length / diameter</label><output id="oLD"></output></div>
  <input type="range" id="lod" min="2.00" max="9.00" step="0.05" value="4.50">

  <div class="row"><label for="exit">nozzle exit radius</label><output id="oE"></output></div>
  <input type="range" id="exit" min="0.20" max="1.00" step="0.01" value="0.62">

  <h2>case profile</h2>
  <div id="stations"></div>

  <button id="copy">copy profile</button>

  <h2>view</h2>
  <div class="check"><input type="checkbox" id="axes" checked><label for="axes">origin axes</label></div>
  <div class="check"><input type="checkbox" id="grid"><label for="grid">grid</label></div>
  <div class="check"><input type="checkbox" id="wire"><label for="wire">wireframe</label></div>
  <div class="check"><input type="checkbox" id="spin"><label for="spin">spin fan</label></div>

  <button id="frame">frame engine</button>
  <button id="origin">look at origin</button>

  <div id="readout"></div>
  <p class="hint">drag orbit &middot; scroll zoom &middot; right-drag pan</p>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { turbojet } from './components/engines.js';
import { disposeTree } from './components/geom.js';
import { all as MATERIALS } from './components/materials.js';

const STATIONS = [{ z: 0.35, r: 1.0 }, { z: 0.70, r: 1.0 }];
{
  const host = document.getElementById('stations');
  STATIONS.forEach((d, i) => {
    for (const [k, min, max, step] of [['z', 0.03, 0.97, 0.01],
                                       ['r', 0.30, 1.60, 0.01]]) {
      const id = `${k}${i}`;
      host.insertAdjacentHTML('beforeend',
        `<div class="row"><label for="${id}">station ${i + 1} &mdash; ` +
        `${k === 'z' ? 'position' : 'radius'}</label>` +
        `<output id="o_${id}"></output></div>` +
        `<input type="range" id="${id}" min="${min}" max="${max}" ` +
        `step="${step}" value="${d[k]}">`);
    }
  });
}

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);

const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0x9fb4cc, 0x191c21, 1.6));
const key = new THREE.DirectionalLight(0xfff3e2, 2.4);
key.position.set(5, 7, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x93b6ff, 0.65);
fill.position.set(-6, 3, -5);
scene.add(fill);
// From dead ahead, so the fan is lit rather than a silhouette in its own case.
const nose = new THREE.DirectionalLight(0xffffff, 0.5);
nose.position.set(0, 0.4, 10);
scene.add(nose);

/* ---- origin marker -------------------------------------------------- *
 * The engine's origin is the centre of its front face, so the marker sits
 * in the fan plane. Kept as explicit lines rather than AxesHelper so the
 * lengths can track fan radius and the arms extend both ways.            */
const axes = new THREE.Group();
scene.add(axes);
function rebuildAxes(L) {
  for (const ch of [...axes.children]) { ch.geometry.dispose(); axes.remove(ch); }
  const spec = [[[L, 0, 0], 0xd8544f], [[0, L, 0], 0x74c46a], [[0, 0, L], 0x5b8ff5]];
  for (const [v, colour] of spec) {
    const p = new THREE.Vector3(...v);
    const geo = new THREE.BufferGeometry().setFromPoints([p.clone().negate(), p]);
    axes.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: colour, transparent: true, opacity: 0.85 })));
  }
}

const grid = new THREE.GridHelper(20, 40, 0x39414c, 0x252a31);
grid.visible = false;
scene.add(grid);

/* ---- engine --------------------------------------------------------- */
const el = (id) => document.getElementById(id);
const num = (id) => parseFloat(el(id).value);

let engine = null;

function build() {
  if (engine) { disposeTree(engine); scene.remove(engine); }

  for (const m of Object.values(MATERIALS)) m.wireframe = el('wire').checked;

  const rCase = num('rCase');
  engine = turbojet({
    rCase,
    length: num('lod') * 2 * rCase,
    nozzleExit: num('exit'),
    sections: STATIONS.map((_, i) => ({ z: num(`z${i}`), r: num(`r${i}`) })),
  });
  engine.position.set(0, 0, 0);           // at the origin, unshifted
  scene.add(engine);

  rebuildAxes(rCase * 2.2);
  axes.visible = el('axes').checked;
  grid.visible = el('grid').checked;
  grid.position.y = -rCase * 2.4;
  grid.scale.setScalar(rCase / 0.42);

  el('oR').textContent = rCase.toFixed(2);
  el('oLD').textContent = num('lod').toFixed(2);
  el('oE').textContent = num('exit').toFixed(2);
  STATIONS.forEach((_, i) => {
    for (const k of ['z', 'r']) el(`o_${k}${i}`).textContent = num(`${k}${i}`).toFixed(2);
  });

  const b = new THREE.Box3().setFromObject(engine);
  const bx = new THREE.Box3().setFromObject(engine);
  el('readout').innerHTML =
    `origin <span>0, 0, 0</span> &middot; inlet lip<br>` +
    `nose-tail <span>${engine.userData.overallLength.toFixed(3)}</span> &middot; ` +
    `L/D <span>${engine.userData.lengthOverDiameter.toFixed(2)}</span><br>` +
    `body <span>${engine.userData.bodyLength.toFixed(3)}</span> &middot; ` +
    `exit r <span>${engine.userData.exitRadius.toFixed(3)}</span><br>` +
    `z extent <span>${bx.min.z.toFixed(2)} &hellip; ${bx.max.z.toFixed(2)}</span>`;
}

function frameEngine() {
  const b = new THREE.Box3().setFromObject(engine);
  const c = b.getCenter(new THREE.Vector3());
  const r = b.getSize(new THREE.Vector3()).length() / 2;
  controls.target.copy(c);
  const d = r / Math.sin((camera.fov * Math.PI / 180) / 2) * 0.95;
  camera.position.set(c.x + d * 0.52, c.y + d * 0.34, c.z + d * 0.78);
  camera.near = r / 100; camera.far = r * 100;
  camera.updateProjectionMatrix();
  controls.update();
}

function lookAtOrigin() {
  const r = num('rCase') * 2.5;
  controls.target.set(0, 0, 0);
  camera.position.set(r * 2.6, r * 1.7, r * 4.0);
  controls.update();
}

for (const id of ['rCase', 'lod', 'exit',
                  ...STATIONS.flatMap((_, i) => [`z${i}`, `r${i}`])]) el(id).addEventListener('input', build);
for (const id of ['axes', 'grid', 'wire']) el(id).addEventListener('change', build);
el('copy').addEventListener('click', () => {
  const body = STATIONS.map((_, i) =>
    `{ z: ${num(`z${i}`).toFixed(2)}, r: ${num(`r${i}`).toFixed(2)} }`).join(', ');
  const txt = `const JET_SECTIONS = [${body}];\n`
    + `const JET_LENGTH_OVER_DIAMETER = ${num('lod').toFixed(2)};\n`
    + `nozzleExit = ${num('exit').toFixed(2)}`;
  navigator.clipboard?.writeText(txt);
  const btn = el('copy'); const was = btn.textContent;
  btn.textContent = 'copied'; setTimeout(() => { btn.textContent = was; }, 900);
  console.log(txt);
});
el('frame').addEventListener('click', frameEngine);
el('origin').addEventListener('click', lookAtOrigin);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
function tick() {
  const dt = clock.getDelta();
  if (el('spin').checked && engine) {
    engine.traverse((o) => {
      // Direction comes from the component: which way a rotor has to turn to
      // push air aft is set by the pitch its blades were built with, so it is
      // the component's business and not the viewer's.
      if (o.userData.rotating) o.rotation.z += dt * 2.4 * (o.userData.spin ?? 1);
    });
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

resize();
build();
frameEngine();
tick();
</script>
</body>
</html>
