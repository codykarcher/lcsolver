<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuselage &mdash; component test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #14161a; color: #d7dbe0;
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; }

  #panel { position: fixed; top: 14px; left: 14px; width: 228px; padding: 14px 16px;
    background: #1c1f25e6; border: 1px solid #2e343d; border-radius: 10px;
    backdrop-filter: blur(6px); }
  #panel h1 { margin: 0 0 2px; font-size: 13px; }
  #panel .sub { margin: 0 0 12px; font-size: 11px; color: #838d9a; }
  #panel h2 { margin: 12px 0 6px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .07em; color: #6f7884;
    border-top: 1px solid #2e343d; padding-top: 10px; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; }
  .row label { font-size: 11.5px; color: #aab3bf; }
  .row output { font-variant-numeric: tabular-nums; font-size: 11.5px; color: #e6a34a; }
  input[type=range] { width: 100%; margin: 1px 0 8px; accent-color: #e6a34a; }
  .check { display: flex; align-items: center; gap: 7px; margin: 3px 0 7px;
    font-size: 11.5px; color: #aab3bf; }
  button { width: 100%; padding: 6px 10px; margin-top: 4px; font: inherit;
    font-size: 11.5px; color: #d7dbe0; background: #262b33;
    border: 1px solid #363d47; border-radius: 6px; cursor: pointer; }
  button:hover { background: #2f353f; }
  #readout { margin-top: 10px; padding-top: 9px; border-top: 1px solid #2e343d;
    font-size: 10.5px; color: #6f7884; font-variant-numeric: tabular-nums; }
  #readout span { color: #98a2ae; }
  .hint { margin-top: 8px; font-size: 10.5px; color: #565e69; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="panel">
  <h1>Fuselage</h1>
  <p class="sub">conventional jetliner &mdash; nose at the origin</p>

  <div class="row"><label for="rad">body radius</label><output id="oRad"></output></div>
  <input type="range" id="rad" min="0.80" max="3.50" step="0.01" value="1.88">

  <div class="row"><label for="fine">fineness L/D</label><output id="oFine"></output></div>
  <input type="range" id="fine" min="5.0" max="14.0" step="0.1" value="10.1">

  <div class="row"><label for="droop">nose droop</label><output id="oDroop"></output></div>
  <input type="range" id="droop" min="0.00" max="0.60" step="0.01" value="0.30">

  <h2>features</h2>
  <div class="check"><input type="checkbox" id="radome" checked><label for="radome">radome (nose cap)</label></div>
  <div class="check"><input type="checkbox" id="deck" checked><label for="deck">flight deck glass</label></div>
  <div class="check"><input type="checkbox" id="cabin" checked><label for="cabin">cabin windows</label></div>
  <div class="check"><input type="checkbox" id="doors" checked><label for="doors">entry doors</label></div>
  <div class="check"><input type="checkbox" id="exits" checked><label for="exits">overwing exits</label></div>

  <h2>view</h2>
  <div class="check"><input type="checkbox" id="xray"><label for="xray">translucent OML</label></div>
  <div class="row"><label for="opac">skin opacity</label><output id="oOpac"></output></div>
  <input type="range" id="opac" min="0.03" max="0.60" step="0.01" value="0.16">
  <div class="check"><input type="checkbox" id="axes" checked><label for="axes">origin axes</label></div>
  <div class="check"><input type="checkbox" id="grid"><label for="grid">grid</label></div>
  <div class="check"><input type="checkbox" id="wire"><label for="wire">wireframe</label></div>
  <div class="check"><input type="checkbox" id="prof"><label for="prof">crown, keel &amp; centreline</label></div>

  <button id="frame">frame body</button>
  <button id="side">side view</button>

  <div id="readout"></div>
  <p class="hint">drag orbit &middot; scroll zoom &middot; right-drag pan</p>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { jetlinerFuselage } from './components/fuselage.js';
import { disposeTree } from './components/geom.js';
import { all as MATERIALS, setTranslucent } from './components/materials.js';

const canvas = document.getElementById('view');
// A body tens of metres long, inspected from a metre away, spans a depth range
// a linear 24-bit buffer cannot resolve -- and the first symptom is decals and
// skin trading places in patches as the camera moves. Log depth fixes it at the
// source; the polygon offset on the decal materials handles the rest.
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);

const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 5000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0x9fb4cc, 0x191c21, 1.5));
const key = new THREE.DirectionalLight(0xfff3e2, 2.2);
key.position.set(5, 7, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x93b6ff, 0.7);
fill.position.set(-6, 3, -5);
scene.add(fill);
// Under-lighting, weak: an aeroplane is normally seen against a lit ground and
// a fuselage belly with nothing on it reads as a flat black band.
const bounce = new THREE.DirectionalLight(0xc9d6e4, 0.35);
bounce.position.set(0, -8, 2);
scene.add(bounce);

const axes = new THREE.Group();
scene.add(axes);
function rebuildAxes(L) {
  for (const ch of [...axes.children]) { ch.geometry.dispose(); axes.remove(ch); }
  const spec = [[[L, 0, 0], 0xd8544f], [[0, L, 0], 0x74c46a], [[0, 0, L], 0x5b8ff5]];
  for (const [v, colour] of spec) {
    const p = new THREE.Vector3(...v);
    const geo = new THREE.BufferGeometry().setFromPoints([p.clone().negate(), p]);
    axes.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: colour, transparent: true, opacity: 0.85 })));
  }
}

const grid = new THREE.GridHelper(80, 80, 0x39414c, 0x252a31);
grid.visible = false;
scene.add(grid);

const el = (id) => document.getElementById(id);
const num = (id) => parseFloat(el(id).value);

let body = null, extra = [];

function build() {
  if (body) { disposeTree(body); scene.remove(body); }
  for (const o of extra) { o.geometry?.dispose(); scene.remove(o); }
  extra = [];

  for (const m of Object.values(MATERIALS)) m.wireframe = el('wire').checked;

  const radius = num('rad');
  body = jetlinerFuselage({
    radius,
    length: num('fine') * 2 * radius,
    droop: num('droop'),
    radome: el('radome').checked,
    flightDeck: el('deck').checked,
    cabinWindows: el('cabin').checked,
    doors: el('doors').checked,
    exits: el('exits').checked,
  });
  scene.add(body);
  setTranslucent(el('xray').checked, num('opac'));

  // The two functions the body is actually built from, drawn: the silhouette
  // r(z) top and bottom, and the centreline yc(z) between them. When the shape
  // looks wrong it is nearly always one of these, and reading it off the
  // rendered skin is guesswork.
  if (el('prof').checked) {
    const u = body.userData, L = u.length;
    const top = [], bot = [], mid = [];
    for (let i = 0; i <= 220; i++) {
      const z = -L * i / 220, { yc } = u.shapeAt(z);
      top.push(new THREE.Vector3(0, u.crownAt(z), z));
      bot.push(new THREE.Vector3(0, u.keelAt(z), z));
      mid.push(new THREE.Vector3(0, yc, z));
    }
    for (const [pts, colour] of [[top, 0xe6a34a], [bot, 0xe6a34a], [mid, 0x5b8ff5]]) {
      const ln = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: colour, transparent: true, opacity: 0.9 }));
      scene.add(ln); extra.push(ln);
    }
  }

  rebuildAxes(radius * 2.2);
  axes.visible = el('axes').checked;
  grid.visible = el('grid').checked;
  grid.position.y = -radius * 1.3;
  grid.scale.setScalar(radius / 1.88);

  el('oRad').textContent = radius.toFixed(2);
  el('oFine').textContent = num('fine').toFixed(1);
  el('oDroop').textContent = (num('droop') * radius).toFixed(2);
  el('oOpac').textContent = num('opac').toFixed(2);

  const u = body.userData;
  const b = new THREE.Box3().setFromObject(body);
  el('readout').innerHTML =
    `origin <span>0, 0, 0</span> &middot; nose tip<br>` +
    `length <span>${u.length.toFixed(2)}</span> &middot; ` +
    `dia <span>${(2 * u.radius).toFixed(2)}</span> &middot; ` +
    `L/D <span>${u.fineness.toFixed(2)}</span><br>` +
    `nose <span>${u.noseLength.toFixed(2)}</span> &middot; ` +
    `tailcone <span>${u.tailLength.toFixed(2)}</span><br>` +
    `barrel <span>${u.cabinZ.map((v) => v.toFixed(2)).join(' &hellip; ')}</span> ` +
    `(<span>${(u.cabinZ[0] - u.cabinZ[1]).toFixed(2)}</span>)<br>` +
    `crown <span>${u.crownAt(u.cabinZ[1]).toFixed(2)}</span> at the barrel, ` +
    `<span>${u.crownAt(-u.length).toFixed(2)}</span> at the tip<br>` +
    `keel <span>${u.keelAt(u.cabinZ[1]).toFixed(2)}</span> &rarr; ` +
    `<span>${u.keelAt(-u.length).toFixed(2)}</span> (belly sweep)<br>` +
    `nose tip y <span>${u.shapeAt(0).yc.toFixed(2)}</span> &middot; ` +
    `${u.decals.length} decals<br>` +
    `y extent <span>${b.min.y.toFixed(2)} &hellip; ${b.max.y.toFixed(2)}</span>`;
}

function frameBody() {
  const b = new THREE.Box3().setFromObject(body);
  const c = b.getCenter(new THREE.Vector3());
  const r = b.getSize(new THREE.Vector3()).length() / 2;
  controls.target.copy(c);
  const d = r / Math.sin((camera.fov * Math.PI / 180) / 2) * 0.95;
  camera.position.set(c.x + d * 0.62, c.y + d * 0.30, c.z + d * 0.72);
  camera.near = r / 200; camera.far = r * 100;
  camera.updateProjectionMatrix();
  controls.update();
}

function sideView() {
  const L = body.userData.length;
  controls.target.set(0, 0, -L / 2);
  camera.position.set(L * 1.6, 0, -L / 2);
  controls.update();
}

for (const id of ['rad', 'fine', 'droop', 'opac'])
  el(id).addEventListener('input', build);
for (const id of ['axes', 'grid', 'wire', 'prof', 'xray',
                  'radome', 'deck', 'cabin', 'doors', 'exits'])
  el(id).addEventListener('change', build);
el('frame').addEventListener('click', frameBody);
el('side').addEventListener('click', sideView);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

function tick() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

resize();
build();
frameBody();
tick();
</script>
</body>
</html>
