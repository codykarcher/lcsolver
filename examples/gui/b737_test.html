<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>737 &mdash; assembled from the sizing deck</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #14161a; color: #d7dbe0;
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; }

  #panel { position: fixed; top: 14px; left: 14px; width: 250px;
    max-height: calc(100vh - 28px); overflow-y: auto; padding: 14px 16px;
    background: #1c1f25e6; border: 1px solid #2e343d; border-radius: 10px;
    backdrop-filter: blur(6px); }
  #panel h1 { margin: 0 0 2px; font-size: 13px; }
  #panel .sub { margin: 0 0 12px; font-size: 11px; color: #838d9a; }
  #panel h2 { margin: 13px 0 7px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .07em; color: #6f7884;
    border-top: 1px solid #2e343d; padding-top: 10px; }
  .check { display: flex; align-items: center; gap: 7px; margin: 3px 0 7px;
    font-size: 11.5px; color: #aab3bf; }
  button { width: 100%; padding: 6px 10px; margin-top: 4px; font: inherit;
    font-size: 11.5px; color: #d7dbe0; background: #262b33;
    border: 1px solid #363d47; border-radius: 6px; cursor: pointer; }
  button:hover { background: #2f353f; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair.three { grid-template-columns: 1fr 1fr 1fr; }
  .pair button { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 10.5px;
    font-variant-numeric: tabular-nums; }
  td { padding: 1px 0; color: #6f7884; }
  td.n { text-align: right; color: #98a2ae; }
  td.ok { text-align: right; color: #74c46a; }
  #readout { margin-top: 10px; padding-top: 9px; border-top: 1px solid #2e343d;
    font-size: 10.5px; color: #6f7884; font-variant-numeric: tabular-nums; }
  #readout span { color: #98a2ae; }
  .hint { margin-top: 9px; font-size: 10.5px; color: #565e69; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="panel">
  <h1>Boeing 737-800</h1>
  <p class="sub">assembled from the SPaircraft <code>optimal737</code> solve</p>

  <h2>against the solve</h2>
  <table id="compare"></table>

  <h2>view</h2>
  <div class="check"><input type="checkbox" id="detail"><label for="detail">fuselage detail</label></div>
  <div class="check"><input type="checkbox" id="ground" checked><label for="ground">ground plane</label></div>
  <div class="check"><input type="checkbox" id="sit" checked><label for="sit">sit on the gear</label></div>
  <div class="check"><input type="checkbox" id="wire"><label for="wire">wireframe</label></div>
  <div class="check"><input type="checkbox" id="axes"><label for="axes">origin axes</label></div>

  <h2>view from</h2>
  <div class="pair three">
    <button id="side">side</button>
    <button id="plan">plan</button>
    <button id="front">front</button>
  </div>
  <div class="pair">
    <button id="three">three-quarter</button>
    <button id="frame">frame</button>
  </div>

  <div id="readout"></div>
  <p class="hint">drag orbit &middot; scroll zoom &middot; right-drag pan</p>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { conventionalAircraft, B737_TASOPT } from './components/aircraft.js';
import { disposeTree } from './components/geom.js';
import { all as MATERIALS } from './components/materials.js';

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);

const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 5000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0x9fb4cc, 0x191c21, 1.4));
const key = new THREE.DirectionalLight(0xfff3e2, 2.1);
key.position.set(6, 9, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x93b6ff, 0.7);
fill.position.set(-7, 4, -6);
scene.add(fill);
// Weak from below: an aeroplane on the ground is lit from under by the apron,
// and without it the whole underside -- gear, engines, wing lower surface --
// reads as one black shape.
const bounce = new THREE.DirectionalLight(0xc9d6e4, 0.40);
bounce.position.set(0, -8, 3);
scene.add(bounce);

const el = (id) => document.getElementById(id);

const axes = new THREE.Group();
scene.add(axes);
for (const [v, colour] of [[[4, 0, 0], 0xd8544f], [[0, 4, 0], 0x74c46a], [[0, 0, 4], 0x5b8ff5]]) {
  const p = new THREE.Vector3(...v);
  axes.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([p.clone().negate(), p]),
    new THREE.LineBasicMaterial({ color: colour, transparent: true, opacity: 0.85 })));
}

let plane = null, craft = null;

/** The numbers the solve produced, to compare the assembly against. */
const SOLVE = [
  ['wing area', 'wing', 116.649],
  ['h tail area', 'horizontalTail', 19.095],
  ['v tail area', 'verticalTail', 15.859],
];

function build() {
  if (craft) { disposeTree(craft); scene.remove(craft); }
  if (plane) { plane.geometry.dispose(); scene.remove(plane); plane = null; }

  for (const m of Object.values(MATERIALS)) m.wireframe = el('wire').checked;

  craft = conventionalAircraft(B737_TASOPT, {
    detail: el('detail').checked,
    sitOnGround: el('sit').checked,
  });
  scene.add(craft);
  const u = craft.userData;

  if (el('ground').checked) {
    plane = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 120),
      new THREE.MeshStandardMaterial({ color: 0x1b1f26, roughness: 0.95 }));
    plane.rotation.x = -Math.PI / 2;
    plane.position.set(0, u.ground, -u.deck.fuseLength * 0.45);
    scene.add(plane);
  }
  axes.visible = el('axes').checked;

  // Areas are the check that the whole conversion is right: they are not
  // inputs anywhere, they fall out of the chords and spans, and the solve
  // computed them independently.
  el('compare').innerHTML = SOLVE.map(([label, key, want]) => {
    const got = u.areas[key];
    const rel = Math.abs(got - want) / want;
    return `<tr><td>${label}</td><td class="n">${got.toFixed(3)}</td>` +
           `<td class="n">${want.toFixed(3)}</td>` +
           `<td class="${rel < 1e-3 ? 'ok' : 'n'}">${rel.toExponential(0)}</td></tr>`;
  }).join('');

  const d = u.deck;
  el('readout').innerHTML =
    `fuselage <span>${d.fuseLength.toFixed(2)}</span> long, ` +
    `<span>${(2 * d.fuseRadius).toFixed(2)}</span> across<br>` +
    `wing <span>${d.wingSpan.toFixed(2)}</span> span, LE sweep ` +
    `<span>${u.leadingEdgeSweeps.wing.toFixed(1)}&deg;</span> ` +
    `(deck quotes <span>${d.wingSweepC4}&deg;</span> at c/4)<br>` +
    `tails: LE <span>${u.leadingEdgeSweeps.horizontalTail.toFixed(1)}&deg;</span> / ` +
    `<span>${u.leadingEdgeSweeps.verticalTail.toFixed(1)}&deg;</span><br>` +
    `arms from the wing: HT <span>${d.htArm.toFixed(2)}</span>, ` +
    `VT <span>${d.vtArm.toFixed(2)}</span><br>` +
    `nacelle <span>${d.nacelleDia.toFixed(2)}</span> across at y ` +
    `<span>&plusmn;${d.engineY.toFixed(2)}</span><br>` +
    // The one number here that is neither an input nor a placement choice.
    `static attitude <span>${u.groundAttitude.toFixed(2)}&deg;</span> nose-up ` +
    `&mdash; the two strut lengths disagree by ` +
    `<span>${(u.noseContact - u.mainContact).toFixed(3)}</span> over a ` +
    `<span>${u.wheelbase.toFixed(2)}</span> wheelbase`;
}

function frameAll() {
  const b = new THREE.Box3().setFromObject(craft);
  const c = b.getCenter(new THREE.Vector3());
  const r = b.getSize(new THREE.Vector3()).length() / 2;
  controls.target.copy(c);
  const dd = r / Math.sin((camera.fov * Math.PI / 180) / 2) * 0.95;
  camera.position.set(c.x + dd * 0.45, c.y + dd * 0.28, c.z + dd * 0.85);
  camera.near = r / 500; camera.far = r * 100;
  camera.updateProjectionMatrix();
  controls.update();
}

function ortho(which) {
  const u = craft.userData, L = u.deck.fuseLength;
  const c = new THREE.Vector3(0, u.ground + 3, -L / 2);
  const d = L * 1.5;
  controls.target.copy(c);
  if (which === 'side') camera.position.set(c.x + d, c.y, c.z);
  else if (which === 'plan') camera.position.set(c.x, c.y + d, c.z + 0.001);
  else if (which === 'front') camera.position.set(c.x, c.y, c.z + d);
  else camera.position.set(c.x + d * 0.55, c.y + d * 0.34, c.z + d * 0.72);
  camera.near = d / 500; camera.far = d * 100;
  camera.updateProjectionMatrix();
  controls.update();
}

for (const id of ['detail', 'ground', 'sit', 'wire', 'axes'])
  el(id).addEventListener('change', build);
for (const v of ['side', 'plan', 'front']) el(v).addEventListener('click', () => ortho(v));
el('three').addEventListener('click', () => ortho('three'));
el('frame').addEventListener('click', frameAll);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

function tick() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

resize();
build();
ortho('three');
tick();
</script>
</body>
</html>
