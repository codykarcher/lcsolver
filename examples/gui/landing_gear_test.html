<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing gear &mdash; component test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #14161a; color: #d7dbe0;
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #view { position: fixed; inset: 0; }

  #panel { position: fixed; top: 14px; left: 14px; width: 232px; padding: 14px 16px;
    background: #1c1f25e6; border: 1px solid #2e343d; border-radius: 10px;
    backdrop-filter: blur(6px); }
  #panel h1 { margin: 0 0 2px; font-size: 13px; letter-spacing: .02em; }
  #panel .sub { margin: 0 0 12px; font-size: 11px; color: #838d9a; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline;
    margin-bottom: 2px; }
  .row label { font-size: 11.5px; color: #aab3bf; }
  .row output { font-variant-numeric: tabular-nums; font-size: 11.5px; color: #e6a34a; }
  input[type=range] { width: 100%; margin: 0 0 9px; accent-color: #e6a34a; }
  .check { display: flex; align-items: center; gap: 7px; margin: 4px 0 10px;
    font-size: 11.5px; color: #aab3bf; }
  button { width: 100%; padding: 6px 10px; font: inherit; font-size: 11.5px;
    color: #d7dbe0; background: #262b33; border: 1px solid #363d47;
    border-radius: 6px; cursor: pointer; }
  button:hover { background: #2f353f; }
  .hint { margin-top: 11px; padding-top: 10px; border-top: 1px solid #2e343d;
    font-size: 10.5px; color: #6f7884; }

  .tag { position: fixed; transform: translate(-50%, 0);
    font-size: 11.5px; color: #98a2ae; white-space: nowrap;
    text-shadow: 0 1px 3px #000; pointer-events: none; }
  .tag b { color: #e6e9ee; font-weight: 600; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="panel">
  <h1>Landing gear</h1>
  <p class="sub">1 / 2 / 4 / 6 wheel variants</p>

  <div class="row"><label for="rTire">tire radius</label><output id="oTire"></output></div>
  <input type="range" id="rTire" min="0.15" max="0.90" step="0.01">

  <div class="row"><label for="rWheel">wheel radius</label><output id="oWheel"></output></div>
  <input type="range" id="rWheel" min="0.05" max="0.80" step="0.01">

  <div class="row"><label for="lStrut">strut length</label><output id="oLen"></output></div>
  <input type="range" id="lStrut" min="0.30" max="3.00" step="0.01">

  <div class="row"><label for="rStrut">strut radius</label><output id="oRad"></output></div>
  <input type="range" id="rStrut" min="0.02" max="0.30" step="0.005">

  <div class="check">
    <input type="checkbox" id="links" checked><label for="links">torque links</label>
  </div>
  <button id="reset">reset</button>

  <p class="hint">drag to orbit &middot; scroll to zoom &middot; right-drag to pan</p>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { landingGear, disposeGear } from './components/landing_gear.js';

const VARIANTS = [1, 2, 4, 6];
const DEFAULTS = { rWheel: 0.28, rTire: 0.45, lStrut: 1.30, rStrut: 0.09 };

/* ---------- scene ---------- */
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
scene.fog = new THREE.Fog(0x14161a, 14, 34);

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 200);
camera.position.set(4.2, 2.4, 6.4);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 0.55, 0);

scene.add(new THREE.HemisphereLight(0x9fb4cc, 0x1a1d22, 1.5));

const key = new THREE.DirectionalLight(0xfff3e2, 2.3);
key.position.set(5, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
const c = key.shadow.camera;
c.left = -7; c.right = 7; c.top = 7; c.bottom = -7; c.near = 0.5; c.far = 30;
key.shadow.bias = -0.0012;
scene.add(key);

const fill = new THREE.DirectionalLight(0x93b6ff, 0.55);
fill.position.set(-6, 3, -4);
scene.add(fill);

// Ground: a shadow-catcher plus a grid, so height off the floor is readable.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x1b1e24, roughness: 1, metalness: 0 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(40, 80, 0x39414c, 0x252a31);
grid.position.y = 0.001;
scene.add(grid);

/* ---------- gears ---------- */
const root = new THREE.Group();
scene.add(root);

const tags = VARIANTS.map((n) => {
  const el = document.createElement('div');
  el.className = 'tag';
  el.innerHTML = `<b>${n}</b> wheel${n > 1 ? 's' : ''}`;
  document.body.appendChild(el);
  return el;
});
const anchors = [];

function build() {
  for (const child of [...root.children]) { disposeGear(child); root.remove(child); }
  anchors.length = 0;

  const p = readParams();
  const gears = VARIANTS.map((wheels) => landingGear({ wheels, ...p }));

  // Lay them out along X with a constant gap, using each gear's own width so
  // the six-wheeler does not crowd its neighbour.
  const gap = Math.max(0.55, p.rTire * 1.5);
  const widths = gears.map((g) => {
    const b = new THREE.Box3().setFromObject(g);
    return b.max.x - b.min.x;
  });
  const total = widths.reduce((a, b) => a + b, 0) + gap * (gears.length - 1);

  let x = -total / 2;
  gears.forEach((g, i) => {
    x += widths[i] / 2;
    g.position.set(x, -g.userData.contactY, 0);      // stand it on y = 0
    g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    root.add(g);
    anchors.push(new THREE.Vector3(x, 0, 0));
    x += widths[i] / 2 + gap;
  });
}

/* ---------- controls ---------- */
const el = (id) => document.getElementById(id);
const inputs = { rWheel: el('rWheel'), rTire: el('rTire'),
                 lStrut: el('lStrut'), rStrut: el('rStrut') };
const outs = { rWheel: el('oWheel'), rTire: el('oTire'),
               lStrut: el('oLen'), rStrut: el('oRad') };

function readParams() {
  const p = {};
  for (const k of Object.keys(inputs)) p[k] = parseFloat(inputs[k].value);
  // The component rejects rWheel >= rTire, which as a slider pair is very easy
  // to hit. Clamp here rather than let it throw.
  p.rWheel = Math.min(p.rWheel, p.rTire - 0.02);
  p.torqueLinks = el('links').checked;
  for (const k of Object.keys(outs)) outs[k].textContent = p[k].toFixed(3);
  return p;
}

function setDefaults() {
  for (const k of Object.keys(inputs)) inputs[k].value = DEFAULTS[k];
  el('links').checked = true;
}

for (const inp of Object.values(inputs)) inp.addEventListener('input', build);
el('links').addEventListener('change', build);
el('reset').addEventListener('click', () => { setDefaults(); build(); });

/* ---------- loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

const v = new THREE.Vector3();
function tick() {
  controls.update();
  renderer.render(scene, camera);
  // Park each label just under its gear, in screen space.
  anchors.forEach((a, i) => {
    v.copy(a).project(camera);
    tags[i].style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
    tags[i].style.top = `${(-v.y * 0.5 + 0.5) * innerHeight + 12}px`;
    tags[i].style.opacity = v.z > 1 ? 0 : 1;
  });
  requestAnimationFrame(tick);
}

setDefaults();
resize();
build();
tick();
</script>
</body>
</html>
