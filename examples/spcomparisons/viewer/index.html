<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>spcomparisons viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #11151a; color: #dfe6ee;
         font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  #panel { padding: 14px 16px; overflow-y: auto; border-right: 1px solid #232a33;
           background: #151a20; }
  #stage { position: relative; }
  canvas { display: block; }
  h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: #7b8794; font-size: 11px; margin-bottom: 14px; }
  label { display: block; font-size: 11px; text-transform: uppercase;
          letter-spacing: .06em; color: #7b8794; margin: 14px 0 5px; }
  select, input[type=range] { width: 100%; }
  select { background: #1d242c; color: #dfe6ee; border: 1px solid #2b333d;
           border-radius: 4px; padding: 6px 8px; font-size: 12px; }
  .layer { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .layer input { accent-color: #4a9eff; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px;
          font-variant-numeric: tabular-nums; }
  td { padding: 2px 0; }
  td:last-child { text-align: right; color: #aeb9c6; }
  .note { font-size: 11px; color: #8b9bb0; border-left: 2px solid #eea800;
          padding: 5px 0 5px 8px; margin: 6px 0; background: #1a1f26; }
  .warn { border-left-color: #d55e00; }
  #hud { position: absolute; left: 14px; bottom: 12px; font-size: 11px;
         color: #6f7c8a; pointer-events: none; }
  /* Never cover the canvas. An overlay spanning the viewport swallows every
     orbit drag, which reads as "the viewer refuses to rotate". */
  #err { position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
         display: none; max-width: 70%; padding: 10px 14px; border-radius: 6px;
         background: #2a1a14; border: 1px solid #d55e00; color: #ffb08a;
         font-size: 12px; white-space: pre-line; pointer-events: none;
         z-index: 5; }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>spcomparisons</h1>
    <div class="sub">geometry from the solve &middot; schematic, not the CSM</div>

    <label for="case">case</label>
    <select id="case"></select>

    <label>layers</label>
    <div id="layers"></div>

    <label for="skin">render</label>
    <select id="skin">
      <option value="ghost" selected>ghost &mdash; skin faint, internals visible</option>
      <option value="outer">outer &mdash; mould line, internals hidden</option>
      <option value="xray">x-ray &mdash; everything faint</option>
    </select>

    <label for="ex">structure exaggeration <span id="exv">40&times;</span></label>
    <input type="range" id="ex" min="1" max="120" value="40">

    <label for="sweep">wing sweep <span id="swv">25&deg;</span></label>
    <input type="range" id="sweep" min="0" max="40" value="25">

    <label>dimensions</label>
    <table id="dims"></table>

    <label>assumptions</label>
    <div id="notes"></div>
  </div>
  <div id="stage">
    <div id="hud">drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
    <div id="err"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module">
import * as THREE from './lib/three.module.js';
import { OrbitControls } from './lib/OrbitControls.js';
import { build, LAYERS } from './aircraft.js';

const COLORS = { oml:'#bcc6d4', structure:'#d55e00', cabin:'#7fd4ff',
                 payload:'#37506b', propulsion:'#9aa3ad',
                 energy:'#009e73', gear:'#555' };

// --- architecture flags, mirroring architectures.py ------------------------
const ARCH = {
  conventional:  { double_bubble:false, rear_engines:false, cryo_tank:false, fuel_cell:false, battery:false },
  conventional_M:{ double_bubble:false, rear_engines:false, cryo_tank:false, fuel_cell:false, battery:false },
  d8:            { double_bubble:true,  rear_engines:true,  cryo_tank:false, fuel_cell:false, battery:false },
  h2burn:        { double_bubble:false, rear_engines:false, cryo_tank:true,  fuel_cell:false, battery:false },
  h2fc:          { double_bubble:false, rear_engines:false, cryo_tank:true,  fuel_cell:true,  battery:false },
  battery:       { double_bubble:false, rear_engines:false, cryo_tank:false, fuel_cell:false, battery:true  },
};

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11151a);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdfe9f5, 0x202830, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(1, 2, 1.5); scene.add(key);
const fill = new THREE.DirectionalLight(0xa8c4e0, 0.5);
fill.position.set(-1.5, -0.5, -1); scene.add(fill);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

let current = null, values = null, archKey = null;
const visible = Object.fromEntries(LAYERS.map(l => [l, true]));

function rebuild() {
  if (!values) return;
  if (current) { scene.remove(current); current.traverse(o => o.geometry?.dispose()); }
  const ex = +document.getElementById('ex').value;
  const sweepDeg = +document.getElementById('sweep').value;
  const skin = document.getElementById('skin').value;
  current = build(values, ARCH[archKey] ?? ARCH.conventional,
                  { exaggerate: ex, sweepDeg, skin });
  // centre it
  const L = current.userData.extent ?? 40;
  current.position.x = -L / 2;
  scene.add(current);
  applyLayers();
  showNotes();
}

function applyLayers() {
  if (!current) return;
  for (const child of current.children)
    child.visible = visible[child.userData.layer] ?? true;
}

function showNotes() {
  const box = document.getElementById('notes');
  const seen = new Set(); const out = [];
  current.traverse(o => {
    if (o.userData?.note && !seen.has(o.userData.note)) {
      seen.add(o.userData.note);
      out.push(`<div class="note ${o.userData.placed === false ? 'warn' : ''}">${o.userData.note}</div>`);
    }
  });
  box.innerHTML = out.join('') ||
    '<div class="note">no assumptions recorded for this case</div>';
}

const DIMS = [
  ['span',        'Wing_b',       'm'],
  ['wing area',   'Wing_S',       'm²'],
  ['root chord',  'Wing_c_root',  'm'],
  ['t/c',         'Wing_tau',     ''],
  ['fuse length', 'Fuse_l_fuse',  'm'],
  ['fuse width',  'Fuse_w_fuse',  'm'],
  ['passengers',  'Fuse_n_pass',  ''],
  ['rows',        'Fuse_n_rows',  ''],
  ['cap t',       'Wing_box_t_cap','mm', 1000],
  ['web t',       'Wing_box_t_web','mm', 1000],
  ['fan dia',     'Eng_d_f',      'm'],
];
function showDims() {
  document.getElementById('dims').innerHTML = DIMS.map(([label, k, u, s]) => {
    if (!(k in values)) return '';
    const val = values[k] * (s ?? 1);
    const txt = Math.abs(val) >= 100 ? val.toFixed(0)
              : Math.abs(val) >= 1 ? val.toFixed(2) : val.toFixed(3);
    return `<tr><td>${label}</td><td>${txt} ${u}</td></tr>`;
  }).join('');
}

function say(msg) {
  const e = document.getElementById('err');
  e.style.display = msg ? 'block' : 'none';
  e.textContent = msg || '';
}

async function loadCase(file) {
  try {
    const r = await fetch('../results/' + file);
    if (!r.ok) throw new Error(`${r.status} fetching ${file}`);
    const d = await r.json();
    if (!d.values || typeof d.values !== 'object' || !Object.keys(d.values).length) {
      // 15 of the 23 runs did not converge and carry `values: null`. That is a
      // fact about the sweep, not a failure of the viewer -- say so and leave
      // the previous aircraft on screen rather than blanking it.
      say(`${d.class} — ${d.arch} has no solution to draw` +
          (d.status ? `\n${d.status}` : '') +
          `\n\nShowing the previous case.`);
      return;
    }
    say('');
    values = d.values; archKey = d.arch;
    rebuild(); showDims();
    const L = current.userData.extent ?? 40;
    camera.position.set(L * 0.55, L * 0.35, L * 0.85);
    controls.target.set(0, 0, 0); controls.update();
  } catch (e) {
    say(`${e.message}\n\nServe this directory over HTTP — fetch is blocked on file://\n` +
        `cd ~/Desktop/spcomparisons && python -m http.server 8742\n` +
        `then open http://localhost:8742/viewer/`);
  }
}

// --- UI --------------------------------------------------------------------
document.getElementById('layers').innerHTML = LAYERS.map(l =>
  `<div class="layer"><input type="checkbox" id="L_${l}" checked>` +
  `<span class="swatch" style="background:${COLORS[l]}"></span>` +
  `<label for="L_${l}" style="margin:0;text-transform:none;letter-spacing:0;color:#dfe6ee;font-size:12px">${l}</label></div>`
).join('');
for (const l of LAYERS)
  document.getElementById('L_' + l).onchange = e => { visible[l] = e.target.checked; applyLayers(); };

document.getElementById('skin').onchange = rebuild;

for (const [id, span, fmt] of [['ex','exv',v=>v+'×'], ['sweep','swv',v=>v+'°']]) {
  const el = document.getElementById(id);
  el.oninput = () => { document.getElementById(span).textContent = fmt(el.value); rebuild(); };
}

const sel = document.getElementById('case');
fetch('./cases.json').then(r => r.json()).then(cases => {
  sel.innerHTML = cases.map(c =>
    `<option value="${c.file}"${c.hasValues ? '' : ' disabled'}>` +
    `${c.hasValues ? '' : '— '}${c.cls} — ${c.arch}` +
    `${c.hasValues ? '' : ' (no solution)'}</option>`
  ).join('');
  sel.onchange = () => loadCase(sel.value);
  resize();
  const first = cases.find(c => c.hasValues) ?? cases[0];
  sel.value = first.file;
  loadCase(first.file);
}).catch(() => {
  say('could not read cases.json — serve over HTTP:\n' +
      'cd ~/Desktop/spcomparisons && python -m http.server 8742\n' +
      'then open http://localhost:8742/viewer/');
});

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
