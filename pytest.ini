[pytest]
markers =
    slow: cross-path integration checks; run with `pytest -m slow`
    veryslow: the full SPaircraft model, about half a minute
# The integration suite is excluded from a plain run. It is the only place the
# several paths from a Formulation to a number are checked against each other,
# so it is worth running before anything that touches a representation.
addopts = -m "not slow and not veryslow"
