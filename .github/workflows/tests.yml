name: tests

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e ".[test]"
      - run: pytest -q

  # The cross-path suite is separate because it is slower and because it fails
  # for a different reason than a unit test does. A unit test failing says a
  # function is wrong; this failing says two routes through the codebase
  # disagree about what the problem IS, which is the defect class this
  # repository actually produces. It found four real bugs in its first two
  # runs, one of them introduced hours earlier the same day.
  #
  # Runs under conda for the same reason the coverage job does: the cross-path
  # suite compares five routes and four of them are IPOPT routes, so on a
  # pip-only runner it skips in its entirety and reports success having
  # compared nothing.
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: lcsolver
          auto-activate-base: false
      - run: pip install -e ".[test]"
      - run: lcsolver-install-solvers --yes    # brings the PyNumero ASL library
      - run: lcsolver-check-solvers
      # One selection, not two. `pytest -m veryslow` was its own step back when
      # SPaircraft carried that marker; the model has since left the repo and
      # nothing carries it, so that step collected zero tests and exited 5 --
      # a red build reporting that a marker is unused. This form runs whatever
      # heavy tests exist and picks a veryslow one back up automatically.
      - run: pytest -m "slow or veryslow" -q
        timeout-minutes: 15

# Coverage lives in its own workflow, coverage.yml, rather than as a third job
# here. A GitHub Actions badge addresses a workflow, not a job, so a coverage
# job in this file could not be badged separately from the tests it sits
# beside -- the two would share one status and one badge.
