name: cross-platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        # The bare install is the path a JOSS reviewer takes, and it must
        # succeed with no MPI, no compiler and no system libraries present.
        # cvxopt is a declared dependency and comes in from here -- it has
        # wheels for every platform in this matrix, so no separate step.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Show environment
        run: python -c "import lcsolver, pyomo; print('lcsolver', lcsolver.__version__); print('pyomo', pyomo.version.version)"

      - name: The bootstrap must run on a machine with no IPOPT
        # --dry-run installs nothing. What it proves is that the plan can be
        # built on all three operating systems, which is the part that would
        # otherwise only ever be exercised on a developer's mac.
        run: |
          python -m lcsolver.install --dry-run
          python -m lcsolver.environment --no-probe; rc=$?
          # 3 is "no IPOPT here", which is the expected state on a CI runner.
          # 1 would mean the report itself crashed, and should fail the job.
          if [ $rc -ne 0 ] && [ $rc -ne 3 ]; then exit $rc; fi
        shell: bash

      - name: Run test suite
        run: python -m pytest tests/ -v
