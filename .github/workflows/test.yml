name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        # The bare install comes first: this is the path a JOSS reviewer will
        # take, and it must succeed without MPI present. cvxopt is added
        # afterwards so the structured-solver tests run instead of skipping.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install cvxopt

      - name: Show environment
        run: python -c "import edi, pyomo; print('edi', edi.__version__); print('pyomo', pyomo.version.version)"

      - name: Run test suite
        run: python -m pytest tests/ -v
